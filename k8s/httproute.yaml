apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: backend-route
  namespace: default

spec:
  parentRefs:
    - name: backend-gateway
      sectionName: https

  hostnames:
    - deepak-aks-api-2509.centralindia.cloudapp.azure.com

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

      backendRefs:
        - name: backend-service
          port: 80