name: Deploy Backend to AKS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  RESOURCE_GROUP: rg-network-deepak
  AKS_CLUSTER: aks-network-lab
  ACR_NAME: acrnetworkdeepak01
  IMAGE_NAME: backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # Step 1 - Checkout repository
      # --------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # Step 2 - Login to Azure
      # --------------------------------------------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}


      # --------------------------------------------------
      # Step 3 - Debug Azure / ACR configuration
      # --------------------------------------------------
      - name: Debug Azure and ACR
        run: |
          echo "===== Azure Account ====="

          az account show \
            --query "{Name:name,SubscriptionId:id}" \
            -o table

          echo ""
          echo "===== Workflow Configuration ====="

          echo "Resource Group: [$RESOURCE_GROUP]"
          echo "AKS Cluster: [$AKS_CLUSTER]"
          echo "ACR Name: [$ACR_NAME]"
          echo "Image Name: [$IMAGE_NAME]"

          echo ""
          echo "===== ACRs visible to GitHub Actions ====="

          az acr list -o table


      # --------------------------------------------------
      # Step 4 - Get ACR login server
      # --------------------------------------------------
      - name: Get ACR Login Server
        id: acr
        run: |
          LOGIN_SERVER=$(az acr show \
            --name "$ACR_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query loginServer \
            --output tsv)

          echo "login_server=$LOGIN_SERVER" >> "$GITHUB_OUTPUT"

          echo "ACR Login Server: $LOGIN_SERVER"


      # --------------------------------------------------
      # Step 5 - Login Docker to ACR
      # --------------------------------------------------
      - name: Login to Azure Container Registry
        run: |
          az acr login \
            --name "$ACR_NAME"


      # --------------------------------------------------
      # Step 6 - Build Docker image
      # --------------------------------------------------
      - name: Build Docker Image
        run: |
          IMAGE="${{ steps.acr.outputs.login_server }}/$IMAGE_NAME:${{ github.sha }}"

          echo "Building image:"
          echo "$IMAGE"

          docker build \
            -t "$IMAGE" \
            .


      # --------------------------------------------------
      # Step 7 - Push image to ACR
      # --------------------------------------------------
      - name: Push Docker Image
        run: |
          IMAGE="${{ steps.acr.outputs.login_server }}/$IMAGE_NAME:${{ github.sha }}"

          echo "Pushing image:"
          echo "$IMAGE"

          docker push "$IMAGE"


      # --------------------------------------------------
      # Step 8 - Install kubectl
      # --------------------------------------------------
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4


      # --------------------------------------------------
      # Step 9 - Get AKS credentials
      # --------------------------------------------------
      - name: Get AKS Credentials
        run: |
          az aks get-credentials \
            --resource-group "$RESOURCE_GROUP" \
            --name "$AKS_CLUSTER" \
            --overwrite-existing


      # --------------------------------------------------
      # Step 10 - Check AKS connection
      # --------------------------------------------------
      - name: Verify AKS Connection
        run: |
          echo "===== AKS Nodes ====="

          kubectl get nodes -o wide


      # --------------------------------------------------
      # Step 11 - Create / Update Kubernetes Secret
      # --------------------------------------------------
      - name: Create Kubernetes Backend Secrets
        env:
          APP_PORT: ${{ secrets.APP_PORT }}
          ENVIRONMENT: ${{ secrets.ENVIRONMENT }}
          UI_URL: ${{ secrets.UI_URL }}

          MONGO_CONNECTION_STRING: ${{ secrets.MONGO_CONNECTION_STRING }}
          MONGO_SYNC_BIT: ${{ secrets.MONGO_SYNC_BIT }}

          JWT_ACCESS_TOKEN_SECRET: ${{ secrets.JWT_ACCESS_TOKEN_SECRET }}
          JWT_ACCESS_TOKEN_EXPIRES_IN: ${{ secrets.JWT_ACCESS_TOKEN_EXPIRES_IN }}

          JWT_REFRESH_TOKEN_SECRET: ${{ secrets.JWT_REFRESH_TOKEN_SECRET }}
          JWT_REFRESH_TOKEN_EXPIRES_IN: ${{ secrets.JWT_REFRESH_TOKEN_EXPIRES_IN }}

          AES_KEY: ${{ secrets.AES_KEY }}

          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}

        run: |
          kubectl create secret generic backend-secrets \
            --from-literal="APP_PORT=$APP_PORT" \
            --from-literal="ENVIRONMENT=$ENVIRONMENT" \
            --from-literal="UI_URL=$UI_URL" \
            --from-literal="MONGO_CONNECTION_STRING=$MONGO_CONNECTION_STRING" \
            --from-literal="MONGO_SYNC_BIT=$MONGO_SYNC_BIT" \
            --from-literal="JWT_ACCESS_TOKEN_SECRET=$JWT_ACCESS_TOKEN_SECRET" \
            --from-literal="JWT_ACCESS_TOKEN_EXPIRES_IN=$JWT_ACCESS_TOKEN_EXPIRES_IN" \
            --from-literal="JWT_REFRESH_TOKEN_SECRET=$JWT_REFRESH_TOKEN_SECRET" \
            --from-literal="JWT_REFRESH_TOKEN_EXPIRES_IN=$JWT_REFRESH_TOKEN_EXPIRES_IN" \
            --from-literal="AES_KEY=$AES_KEY" \
            --from-literal="LOG_LEVEL=$LOG_LEVEL" \
            --dry-run=client \
            -o yaml | kubectl apply -f -


      # --------------------------------------------------
      # Step 12 - Prepare deployment.yaml with image
      # --------------------------------------------------
      - name: Prepare Deployment Manifest
        run: |
          IMAGE="${{ steps.acr.outputs.login_server }}/$IMAGE_NAME:${{ github.sha }}"

          echo "Deploying image:"
          echo "$IMAGE"

          sed "s|__BACKEND_IMAGE__|$IMAGE|g" \
            k8s/deployment.yaml \
            > k8s/deployment-final.yaml

          echo ""
          echo "===== Generated Deployment ====="

          cat k8s/deployment-final.yaml


      # --------------------------------------------------
      # Step 13 - Deploy application to AKS
      # --------------------------------------------------
      - name: Apply Kubernetes Resources
        run: |
          kubectl apply -f k8s/deployment-final.yaml

          kubectl apply -f k8s/service.yaml

          kubectl apply -f k8s/gateway.yaml

          kubectl apply -f k8s/httproute.yaml

          kubectl apply -f k8s/clusterissuer.yaml
          
          kubectl apply -f k8s/certificate.yaml


      # --------------------------------------------------
      # Step 14 - Wait until deployment completes
      # --------------------------------------------------
      - name: Wait for Deployment
        run: |
          kubectl rollout status \
            deployment/backend-deployment \
            --timeout=300s


      # --------------------------------------------------
      # Step 15 - Show Pods
      # --------------------------------------------------
      - name: Show Pods
        run: |
          echo "===== PODS ====="

          kubectl get pods -o wide


      # --------------------------------------------------
      # Step 16 - Show Services
      # --------------------------------------------------
      - name: Show Services
        run: |
          echo "===== SERVICES ====="

          kubectl get services


      # --------------------------------------------------
      # Step 17 - Show Deployment
      # --------------------------------------------------
      - name: Show Deployment
        run: |
          echo "===== DEPLOYMENT ====="

          kubectl get deployment backend-deployment


      # --------------------------------------------------
      # Step 18 - Logout
      # --------------------------------------------------
      - name: Azure Logout
        if: always()
        run: |
          az logout