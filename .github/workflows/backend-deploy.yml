name: Deploy Backend to Azure App Service

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1 - Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2 - Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Step 3 - Install Dependencies
      - name: Install Dependencies
        run: npm install

      # Step 4 - Generate .env.prod
      - name: Generate .env.prod
        run: |
          cat > .env.prod <<EOF
          APP_PORT=${{ secrets.APP_PORT }}
          ENVIRONMENT=${{ secrets.ENVIRONMENT }}
          UI_URL=${{ secrets.UI_URL }}

          MONGO_CONNECTION_STRING=${{ secrets.MONGO_CONNECTION_STRING }}
          MONGO_SYNC_BIT=${{ secrets.MONGO_SYNC_BIT }}

          JWT_ACCESS_TOKEN_SECRET=${{ secrets.JWT_ACCESS_TOKEN_SECRET }}
          JWT_ACCESS_TOKEN_EXPIRES_IN=${{ secrets.JWT_ACCESS_TOKEN_EXPIRES_IN }}

          JWT_REFRESH_TOKEN_SECRET=${{ secrets.JWT_REFRESH_TOKEN_SECRET }}
          JWT_REFRESH_TOKEN_EXPIRES_IN=${{ secrets.JWT_REFRESH_TOKEN_EXPIRES_IN }}

          AES_KEY=${{ secrets.AES_KEY }}

          LOG_LEVEL=${{ secrets.LOG_LEVEL }}
          EOF

      # Step 5 - Build Project
      - name: Build Project
        run: npm run build

      # Step 6 - Azure Login
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

      # Step 7 - Deploy to Azure App Service
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          package: .

      # Step 8 - Logout
      - name: Azure Logout
        run: az logout